[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-bulk-remixer"
version = "0.2.1"
description = "Video Bulk Remixer — công cụ desktop chạy local (CLI + Web UI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.44", "ruff>=0.6", "pyinstaller>=6.0"]

[project.scripts]
videobulkremixer = "videobulkremixer.__main__:main"
videobulkremixer-web = "web.server:main"

[tool.setuptools.packages.find]
include = ["videobulkremixer*", "web*"]

[tool.setuptools.package-data]
web = ["static/**/*"]
videobulkremixer = ["fonts/*.ttf"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: cần tool ngoài / chạy chậm",
  "real: dùng dữ liệu thật qua VIDEOBULKREMIXER_REAL_DATA (không bao giờ commit)",
  "ui: test trình duyệt Playwright",
]
